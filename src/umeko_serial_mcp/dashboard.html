<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>串口 Hub 监控面板</title>
    <style>
        :root {
            --bg: #14161a;
            --panel: #1c1f26;
            --panel-2: #22262e;
            --border: #333a45;
            --border-soft: #2a303a;
            --text: #e6e8ec;
            --muted: #8b93a7;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --ok: #34d399;
            --bad: #f87171;
            --warn: #fbbf24;
            --ai: #c084fc;
            --hw: #2dd4bf;
            --user: #fb923c;
            --sys: #94a3b8;
            --hex: #eab308;
            --input-bg: #0f1218;
            --radius: 10px;
            --log-font-size: 13px;
            --ui-font-size: 13px;
            --shadow: 0 4px 24px rgba(0,0,0,.35);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            padding: 14px 16px 16px;
            background: radial-gradient(1200px 600px at 10% -10%, #1a2740 0%, transparent 50%),
                        radial-gradient(900px 500px at 100% 0%, #1a2030 0%, transparent 45%),
                        var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
                         Consolas, Monaco, "Courier New", monospace;
            font-size: var(--ui-font-size);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100vh;
            transition: padding .15s ease;
        }
        body.log-theater {
            padding: 0;
            gap: 0;
        }
        body.log-theater .topbar,
        body.log-theater .banner-warn,
        body.log-theater .card,
        body.log-theater .toolbar-dock,
        body.log-theater #multi-modal {
            display: none !important;
        }
        body.log-theater #log-container {
            flex: 1;
            min-height: 100vh;
            border-radius: 0;
            border: none;
        }
        .toolbar-dock {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform .22s ease, box-shadow .22s ease;
        }
        body.toolbar-autohide {
            padding-top: 6px;
        }
        body.toolbar-autohide .toolbar-dock {
            position: fixed;
            top: 0;
            left: 16px;
            right: 16px;
            z-index: 1000;
            transform: translateY(calc(-100% + 6px));
            filter: drop-shadow(0 6px 16px rgba(0,0,0,.45));
        }
        body.toolbar-autohide .toolbar-dock:hover,
        body.toolbar-autohide .toolbar-dock:focus-within {
            transform: translateY(0);
        }
        body.toolbar-autohide .toolbar-dock::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -6px;
            height: 6px;
            background: transparent;
        }
        .theater-actions {
            display: none;
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            gap: 8px;
        }
        body.log-theater .theater-actions { display: inline-flex; }
        .theater-actions button {
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(30, 41, 59, .92);
            border: 1px solid var(--border);
            color: #e2e8f0;
            font-size: 13px;
            cursor: pointer;
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px);
        }
        .theater-actions button:hover { background: rgba(51, 65, 85, .95); }
        .theater-exit { display: none; }
        body.log-theater .theater-exit { display: inline-flex; }
        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .02em;
            color: #93c5fd;
        }
        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
            max-width: 720px;
        }
        .ws-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 12px;
            white-space: nowrap;
            box-shadow: var(--shadow);
        }
        .ws-pill .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 0 3px rgba(248,113,113,.15);
        }
        .ws-pill.ok .dot {
            background: var(--ok);
            box-shadow: 0 0 0 3px rgba(52,211,153,.18);
        }
        .ws-pill.bad { color: var(--bad); }
        .ws-pill.ok { color: var(--ok); }
        .banner-warn {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid rgba(251,191,36,.45);
            background: rgba(251,191,36,.12);
            color: #fde68a;
            font-size: 12px;
            line-height: 1.45;
        }
        .banner-warn.show { display: flex; }
        .banner-warn strong { color: #fbbf24; }

        .card {
            background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 10px 12px;
            box-shadow: var(--shadow);
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .row + .row { margin-top: 10px; }
        .status-chip {
            min-width: 168px;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--input-bg);
        }
        .status-chip.on { color: var(--ok); border-color: rgba(52,211,153,.35); }
        .status-chip.off { color: var(--bad); border-color: rgba(248,113,113,.3); }

        .field {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .field > span, .lbl {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }
        select, input[type="text"], input[type="number"] {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            font-family: inherit;
            font-size: var(--ui-font-size);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        select:hover, input[type="text"]:hover, input[type="number"]:hover {
            border-color: #4b5568;
        }
        select:focus, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,.2);
        }
        select:disabled, input:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        /* 串口下拉加宽 */
        #serial-port-select {
            min-width: 320px;
            width: min(480px, 42vw);
            max-width: 100%;
        }
        #serial-port-input {
            min-width: 120px;
            width: 140px;
        }
        #serial-baud-select { min-width: 100px; }
        #serial-encoding-select { min-width: 110px; }
        #period-ms { width: 88px; }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 7px 14px;
            font-weight: 650;
            font-size: var(--ui-font-size);
            font-family: inherit;
            cursor: pointer;
            color: #fff;
            background: var(--accent);
            transition: filter .12s, transform .08s;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn.secondary {
            background: #374151;
            color: #e5e7eb;
        }
        .btn.ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn.danger { background: #dc2626; }
        .btn.ok { background: #059669; }
        .btn.cycle-on {
            background: #84cc16;
            color: #14532d;
        }

        .divider {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 2px;
        }
        .spacer { flex: 1; min-width: 8px; }

        .chk {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .chk input { accent-color: var(--accent); width: 15px; height: 15px; }

        input[type="range"] {
            width: 120px;
            accent-color: var(--accent);
        }

        #log-container {
            flex: 1;
            min-height: 420px;
            background: #07090d;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 10px 12px;
            overflow-y: auto;
            font-family: Consolas, "Cascadia Mono", "Microsoft YaHei Mono", monospace;
            font-size: var(--log-font-size);
            line-height: 1.45;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
        }
        #log-container::-webkit-scrollbar { width: 10px; }
        #log-container::-webkit-scrollbar-thumb {
            background: #2f3642; border-radius: 8px;
        }
        .log-entry { margin-bottom: 3px; word-break: break-word; }
        .timestamp { color: #6b7280; }
        .msg-content { white-space: pre-wrap; }
        .msg-hex { color: var(--hex); }
        .hl-error { color: #ff6b6b; font-weight: 600; font-size: 1.05em; }
        .hl-warn  { color: #fbbf24; font-weight: 600; font-size: 1.05em; }
        .hl-ok    { color: #34d399; font-weight: 600; font-size: 1.05em; }
        .hl-info  { color: #60a5fa; font-size: 1.05em; }
        .source-LLM { color: var(--ai); font-weight: 700; }
        .source-HARDWARE { color: var(--hw); font-weight: 700; }
        .source-USER_OVERRIDE { color: var(--user); font-weight: 700; }
        .source-SYSTEM { color: var(--sys); font-style: italic; }

        .send-bar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: stretch;
        }
        .send-opts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
            align-items: center;
        }
        .send-main {
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }
        #cmd-input {
            flex: 1;
            min-width: 160px;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: var(--ui-font-size);
        }
        .send-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 发送 Tab */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            padding: 8px 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--ui-font-size);
            font-weight: 650;
            margin-bottom: -1px;
            border-radius: 8px 8px 0 0;
        }
        .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.03); }
        .tab-btn.active {
            color: #93c5fd;
            border-bottom-color: var(--accent);
            background: rgba(59,130,246,.08);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .multi-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
            margin-bottom: 8px;
        }
        .multi-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px 2px;
        }
        .multi-row {
            display: grid;
            grid-template-columns: 28px 32px 1fr 72px 56px;
            gap: 8px;
            align-items: center;
        }
        .multi-row .idx {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
        .multi-row input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 6px 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: var(--ui-font-size);
        }
        .multi-row .mini-chk {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }
        .multi-row .mini-chk input { accent-color: var(--accent); }
        .multi-pager {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }
        .multi-row.sending {
            outline: 1px solid rgba(59,130,246,.45);
            border-radius: 8px;
            background: rgba(59,130,246,.06);
        }

        /* 多条发送弹窗 */
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-mask.open { display: flex; }
        .modal {
            width: min(920px, 96vw);
            max-height: min(88vh, 820px);
            background: linear-gradient(180deg, #1c1f26 0%, #171a21 100%);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-soft);
        }
        .modal-head h3 {
            margin: 0;
            font-size: 16px;
            color: #93c5fd;
        }
        .modal-body {
            padding: 12px 16px;
            overflow: auto;
            flex: 1;
        }
        .modal-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid var(--border-soft);
            background: rgba(0,0,0,.15);
        }
        .modal .multi-list { max-height: none; }
        .modal .multi-row {
            grid-template-columns: 28px 36px 1fr 70px 52px;
        }

        @media (max-width: 900px) {
            #serial-port-select {
                min-width: 100%;
                width: 100%;
            }
            .send-bar { grid-template-columns: 1fr; }
            .multi-row {
                grid-template-columns: 24px 28px 1fr;
            }
            .multi-row .mini-chk { grid-column: 3; }
            .modal .multi-row {
                grid-template-columns: 24px 28px 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar-dock">
        <div class="topbar">
            <div class="brand">
                <h1>串口 Hub 监控面板 <span id="ui-version-label" style="font-size:12px;color:var(--muted);font-weight:500"></span></h1>
                <p>常驻 Hub 独占串口；与 Codex MCP 共用缓冲。支持文本/HEX、结尾符、校验、周期发送、日志导出。改代码后请重启 Hub。</p>
            </div>
            <div id="ws-status" class="ws-pill bad">
                <span class="dot"></span>
                <span id="ws-status-text">WebSocket: 连接中...</span>
            </div>
        </div>
        <div id="version-banner" class="banner-warn" role="alert"></div>

        <!-- 连接 -->
        <div class="card">
            <div class="row">
                <div id="serial-status-label" class="status-chip off">串口: 未连接</div>

                <div class="field">
                    <span class="lbl">串口</span>
                    <select id="serial-port-select" title="本机串口列表（含描述）">
                        <option value="">扫描中...</option>
                    </select>
                </div>
                <button type="button" class="btn secondary" id="refresh-ports-btn" onclick="refreshPorts()">刷新</button>
                <div class="field">
                    <span class="lbl">手动</span>
                    <input type="text" id="serial-port-input" placeholder="COM1" title="也可手动输入端口名">
                </div>

                <div class="divider"></div>

                <div class="field">
                    <span class="lbl">波特率</span>
                    <select id="serial-baud-select">
                        <option value="9600">9600</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                        <option value="57600">57600</option>
                        <option value="115200" selected>115200</option>
                        <option value="230400">230400</option>
                        <option value="460800">460800</option>
                        <option value="921600">921600</option>
                    </select>
                </div>
                <div class="field">
                    <span class="lbl">编码</span>
                    <select id="serial-encoding-select" title="中文固件/XCOM 常用 GBK">
                        <option value="utf-8">UTF-8</option>
                        <option value="gbk">GBK</option>
                        <option value="gb18030">GB18030</option>
                    </select>
                </div>

                <button id="serial-toggle-btn" class="btn" onclick="toggleSerial()">连接</button>
                <div class="spacer"></div>
                <button type="button" class="btn ok" id="export-btn" onclick="exportLogs()" title="导出缓冲日志为 TXT，可选择保存位置">导出 TXT</button>
            </div>
        </div>

        <!-- 显示 -->
        <div class="card">
            <div class="row">
                <span class="lbl" style="font-weight:700;color:#93c5fd">显示</span>
                <div class="field">
                    <span>日志字号</span>
                    <input type="range" id="font-size-range" min="10" max="24" value="13">
                    <span id="font-size-label">13px</span>
                </div>
                <div class="field">
                    <span>接收显示</span>
                    <select id="rx-display-mode">
                        <option value="text" selected>文本</option>
                        <option value="hex">HEX</option>
                        <option value="both">文本 + HEX</option>
                    </select>
                </div>
                <label class="chk"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
                <label class="chk"><input type="checkbox" id="show-timestamp" checked> 时间戳</label>
                <label class="chk"><input type="checkbox" id="show-source" checked> 源头标签</label>
                <label class="chk"><input type="checkbox" id="auto-hide-toolbar"> 自动隐藏</label>
                <div class="spacer"></div>
                <button type="button" class="btn ghost" onclick="clearLog()">清屏</button>
                <button type="button" class="btn ghost" id="log-theater-btn" onclick="toggleLogTheater()">只看日志</button>
                <span class="lbl" id="log-count-label">日志: 0 条</span>
            </div>
        </div>
    </div>

    <div id="log-container"></div>
    <div class="theater-actions">
        <button type="button" class="btn ghost" onclick="clearLog()">清屏</button>
        <button type="button" class="theater-exit" id="theater-exit-btn" onclick="toggleLogTheater()">退出只看日志</button>
    </div>

    <!-- 发送 -->
    <div class="card">
        <!-- 公共发送选项 -->
        <div class="send-opts">
            <span class="lbl" style="font-weight:700;color:#93c5fd">发送</span>
            <div class="field">
                <span>模式</span>
                <select id="tx-mode">
                    <option value="text" selected>文本</option>
                    <option value="hex">HEX</option>
                </select>
            </div>
            <div class="field">
                <span>结尾</span>
                <select id="tx-eol">
                    <option value="none">无</option>
                    <option value="cr">CR</option>
                    <option value="lf">LF</option>
                    <option value="crlf" selected>CRLF</option>
                </select>
            </div>
            <div class="field">
                <span>校验</span>
                <select id="tx-checksum">
                    <option value="none" selected>无</option>
                    <option value="sum8">SUM8</option>
                    <option value="xor">XOR8</option>
                    <option value="crc16_modbus">CRC16-Modbus</option>
                </select>
            </div>
            <div class="field">
                <span>周期</span>
                <input type="number" id="period-ms" min="10" step="10" value="1000">
                <span>ms</span>
            </div>
            <button type="button" class="btn secondary" id="open-multi-btn" onclick="openMultiModal()">多条发送...</button>
        </div>

        <div class="row" style="margin-top:10px">
            <div class="send-main" style="flex:1;min-width:0">
                <input type="text" id="cmd-input" placeholder="输入内容 (发送后保留，Enter 发送，↑↓ 历史)..." autocomplete="off">
            </div>
            <div class="send-actions">
                <button id="send-btn" class="btn" onclick="sendCommand(false)">发送</button>
                <label class="chk"><input type="checkbox" id="tx-cycle"> 周期</label>
                <button type="button" class="btn secondary" id="cycle-btn" onclick="toggleCycle()">开始周期</button>
            </div>
        </div>
    </div>

    <!-- 多条发送弹窗（类 XCOM） -->
    <div id="multi-modal" class="modal-mask" onclick="onMultiMaskClick(event)">
        <div class="modal" role="dialog" aria-modal="true" aria-label="多条发送">
            <div class="modal-head">
                <h3>多条发送</h3>
                <div class="row" style="gap:8px">
                    <span class="lbl" id="multi-status">0 条已勾选</span>
                    <button type="button" class="btn ghost" onclick="closeMultiModal()">关闭</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="multi-toolbar">
                    <button type="button" class="btn" onclick="sendMultiSelectedOnce()">发送勾选</button>
                    <button type="button" class="btn secondary" id="multi-cycle-btn" onclick="toggleMultiCycle()">循环发送勾选</button>
                    <button type="button" class="btn ghost" onclick="multiSelectAll(true)">全选本页</button>
                    <button type="button" class="btn ghost" onclick="multiSelectAll(false)">全不选本页</button>
                    <button type="button" class="btn ghost" onclick="multiAddOnePage()">添加一页</button>
                    <button type="button" class="btn ghost" onclick="multiClearEmpty()">清空空行</button>
                    <button type="button" class="btn ghost" onclick="multiExport()">导出条目</button>
                    <button type="button" class="btn ghost" onclick="multiImport()">导入条目</button>
                </div>
                <div class="lbl" style="margin:6px 0 8px">勾选要发送的条目，内容会自动保存，下次打开仍在。</div>
                <div id="multi-list" class="multi-list"></div>
                <div class="multi-pager">
                    <span id="multi-page-info">页码 1/1</span>
                    <button type="button" class="btn ghost" onclick="multiGoPage(-1)">上一页</button>
                    <button type="button" class="btn ghost" onclick="multiGoPage(1)">下一页</button>
                    <span>每页</span>
                    <select id="multi-page-size">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                    <span>条 · 共 <span id="multi-total">0</span> 条</span>
                </div>
            </div>
