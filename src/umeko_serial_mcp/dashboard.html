                <span class="lbl">使用上方公共「模式/结尾/校验/周期」；条目勾 HEX 可覆盖模式。</span>
                <div class="spacer"></div>
                <button type="button" class="btn ok" onclick="closeMultiModal()">完成</button>
            </div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('log-container');
        const wsStatusEl = document.getElementById('ws-status');
        const wsStatusText = document.getElementById('ws-status-text');
        const cmdInput = document.getElementById('cmd-input');
        const serialStatusLabel = document.getElementById('serial-status-label');
        const serialPortSelect = document.getElementById('serial-port-select');
        const serialPortInput = document.getElementById('serial-port-input');
        const serialBaudSelect = document.getElementById('serial-baud-select');
        const serialEncodingSelect = document.getElementById('serial-encoding-select');
        const serialToggleBtn = document.getElementById('serial-toggle-btn');
        const fontSizeRange = document.getElementById('font-size-range');
        const fontSizeLabel = document.getElementById('font-size-label');
        const rxDisplayMode = document.getElementById('rx-display-mode');
        const autoScrollEl = document.getElementById('auto-scroll');
        const showTimestampEl = document.getElementById('show-timestamp');
        const showSourceEl = document.getElementById('show-source');
        const autoHideToolbarEl = document.getElementById('auto-hide-toolbar');
        const txMode = document.getElementById('tx-mode');
        const txEol = document.getElementById('tx-eol');
        const txChecksum = document.getElementById('tx-checksum');
        const txCycle = document.getElementById('tx-cycle');
        const periodMs = document.getElementById('period-ms');
        const cycleBtn = document.getElementById('cycle-btn');
        const multiCycleBtn = document.getElementById('multi-cycle-btn');
        const logCountLabel = document.getElementById('log-count-label');
        const multiListEl = document.getElementById('multi-list');
        const multiPageSizeEl = document.getElementById('multi-page-size');
        const logTheaterBtn = document.getElementById('log-theater-btn');
        const theaterExitBtn = document.getElementById('theater-exit-btn');

        const wsPort = {WS_PORT};
        const defaultEncoding = '{DEFAULT_ENCODING}' || 'gbk';
        const pageHubVersion = '{HUB_VERSION}' || '';
        const EXPECTED_FEATURES = ['convert', 'write_options', 'ring_buffer', 'auto_reconnect', 'send_queue', 'health_version'];
        const wsUrl = 'ws://' + window.location.hostname + ':' + wsPort;
        const apiBase = window.location.origin;

        const uiVerLabel = document.getElementById('ui-version-label');
        if (uiVerLabel && pageHubVersion && pageHubVersion.indexOf('{') < 0) {
            uiVerLabel.textContent = 'v' + pageHubVersion;
        }

        function showVersionBanner(html) {
            const el = document.getElementById('version-banner');
            if (!el) return;
            if (!html) {
                el.classList.remove('show');
                el.innerHTML = '';
                return;
            }
            el.innerHTML = html;
            el.classList.add('show');
        }

        function parseVer(v) {
            return String(v || '0').split('.').map(p => parseInt(String(p).replace(/\D/g, '') || '0', 10));
        }
        function verLt(a, b) {
            const pa = parseVer(a), pb = parseVer(b);
            const n = Math.max(pa.length, pb.length);
            for (let i = 0; i < n; i++) {
                const x = pa[i] || 0, y = pb[i] || 0;
                if (x < y) return true;
                if (x > y) return false;
            }
            return false;
        }

        function applyHealthInfo(health) {
            if (!health || !health.ok) {
                showVersionBanner('<strong>Hub 健康检查失败。</strong> 请先运行 scripts\\start-hub.bat 并保持窗口不关。');
                return;
            }
            const ver = health.version || '';
            const feats = health.features || [];
            const missing = EXPECTED_FEATURES.filter(f => feats.indexOf(f) < 0);
            const parts = [];
            if (!ver) {
                parts.push('Hub 未报告版本（多半是<strong>旧进程未重启</strong>）。');
            } else if (pageHubVersion && pageHubVersion.indexOf('{') < 0 && verLt(ver, pageHubVersion)) {
                parts.push(`Hub 版本 <strong>${ver}</strong> 低于页面期望 <strong>${pageHubVersion}</strong>。`);
            }
            if (!feats.length) {
                parts.push('Hub 未声明 features，convert/自动重连等可能不可用。');
            } else if (missing.length) {
                parts.push('缺少能力: <strong>' + missing.join(', ') + '</strong>。');
            }
            if (parts.length) {
                showVersionBanner(
                    '<div><strong>请重启 Hub</strong> 后再刷新本页（Ctrl+F5）。</div>' +
                    '<div>' + parts.join(' ') + '</div>' +
                    '<div>命令: <code>.\\scripts\\start-hub.bat</code> · 当前 Hub: v' + (ver || '?') + '</div>'
                );
            } else {
                showVersionBanner('');
                if (uiVerLabel) {
                    uiVerLabel.textContent = 'v' + ver + (health.auto_reconnect ? ' · 自动重连' : '');
                }
            }
        }

        async function checkHubHealthHttp() {
            try {
                const resp = await fetch(apiBase + '/api/health', { cache: 'no-store' });
                const json = await resp.json();
                applyHealthInfo(json);
            } catch (e) {
                showVersionBanner('<strong>无法连接 Hub HTTP。</strong> 请启动 start-hub.bat，并确认地址 ' + apiBase);
            }
        }

        let ws = null;
        let reconnectDelay = 1000;
        let pingTimer = null;
        let cycleTimer = null;
        let cycleRunning = false;
        let multiCycleTimer = null;
        let multiCycleRunning = false;
        let multiCycleIndex = 0;
        let seenSeq = new Set();
        let suppressEncodingEvent = false;
        let displayCount = 0;
        let lastLogSource = null;

        const commandHistory = [];
        let historyIndex = -1;
        let draftInput = '';
        let serialState = { connected: false, port: null, baudrate: 115200, encoding: defaultEncoding, reconnecting: false };

        // 多条发送：{ enabled, text, hex }[]
        let multiItems = [];
        let multiPageIndex = 0;
        const MULTI_KEY = 'serial_hub_multi_items_v1';

        // 内存中保留结构化日志，便于导出（与显示同步）
        const logStore = [];
        const LOG_STORE_MAX = 8000;

        const PREF_KEY = 'serial_hub_ui_prefs_v2';
        function loadPrefs() {
            try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); }
            catch { return {}; }
        }
        function savePrefs() {
            localStorage.setItem(PREF_KEY, JSON.stringify({
                fontSize: parseInt(fontSizeRange.value, 10),
                rxDisplay: rxDisplayMode.value,
                autoScroll: autoScrollEl.checked,
                showTimestamp: showTimestampEl.checked,
                showSource: showSourceEl.checked,
                autoHideToolbar: autoHideToolbarEl.checked,
                logTheater: document.body.classList.contains('log-theater'),
                txMode: txMode.value,
                txEol: txEol.value,
                txChecksum: txChecksum.value,
                periodMs: parseInt(periodMs.value, 10) || 1000,
            }));
        }
        function setFontSize(px) {
            document.documentElement.style.setProperty('--log-font-size', px + 'px');
            fontSizeLabel.textContent = px + 'px';
        }
        function applyPrefs() {
            const p = loadPrefs();
            if (p.fontSize) { fontSizeRange.value = p.fontSize; setFontSize(p.fontSize); }
            if (p.rxDisplay) rxDisplayMode.value = p.rxDisplay;
            if (typeof p.autoScroll === 'boolean') autoScrollEl.checked = p.autoScroll;
            if (typeof p.showTimestamp === 'boolean') showTimestampEl.checked = p.showTimestamp;
            if (typeof p.showSource === 'boolean') showSourceEl.checked = p.showSource;
            if (typeof p.autoHideToolbar === 'boolean') autoHideToolbarEl.checked = p.autoHideToolbar;
            updateAutoHideToolbar();
            if (p.logTheater) document.body.classList.add('log-theater');
            updateLogTheaterButton();
            if (p.txMode) txMode.value = p.txMode;
            if (p.txEol) txEol.value = p.txEol;
            if (p.txChecksum) txChecksum.value = p.txChecksum;
            if (p.periodMs) periodMs.value = p.periodMs;
            updatePlaceholder();
        }
        if ([...serialEncodingSelect.options].some(o => o.value === defaultEncoding)) {
            serialEncodingSelect.value = defaultEncoding;
        }
        applyPrefs();

        fontSizeRange.addEventListener('input', () => {
            setFontSize(parseInt(fontSizeRange.value, 10));
            savePrefs();
        });
        function updateAutoHideToolbar() {
            document.body.classList.toggle('toolbar-autohide', autoHideToolbarEl.checked);
        }
        function updateLogTheaterButton() {
            if (!logTheaterBtn) return;
            logTheaterBtn.textContent = document.body.classList.contains('log-theater') ? '退出全屏' : '只看日志';
            logTheaterBtn.title = document.body.classList.contains('log-theater')
                ? '恢复显示连接、发送等面板'
                : '隐藏其他面板，只显示日志区';
        }
        function toggleLogTheater() {
            document.body.classList.toggle('log-theater');
            updateLogTheaterButton();
            savePrefs();
            if (autoScrollEl.checked) logContainer.scrollTop = logContainer.scrollHeight;
        }
        [rxDisplayMode, autoScrollEl, showTimestampEl, showSourceEl, autoHideToolbarEl, txMode, txEol, txChecksum, periodMs].forEach(el => {
            el.addEventListener('change', () => {
                if (el === txMode) updatePlaceholder();
                if (el === periodMs && cycleRunning) restartCycle();
                if (el === rxDisplayMode || el === showTimestampEl || el === showSourceEl) rebuildLogView();
                if (el === autoHideToolbarEl) updateAutoHideToolbar();
                savePrefs();
            });
        });

        function updatePlaceholder() {
            cmdInput.placeholder = txMode.value === 'hex'
                ? 'HEX 示例: 01 03 00 00 00 01  或  010300000001（发送后不清除）'
                : '输入文本指令 (发送后保留，Enter 发送，↑↓ 历史)...';
        }

        function openMultiModal() {
            try {
                if (cycleRunning) stopCycle(true);
                const modal = document.getElementById('multi-modal');
                if (!modal) return;
                modal.classList.add('open');
                renderMultiList();
            } catch (e) {
                console.error(e);
                alert('打开多条发送失败: ' + (e.message || e));
            }
        }
        function closeMultiModal() {
            const modal = document.getElementById('multi-modal');
            if (modal) modal.classList.remove('open');
            // 关闭弹窗不停循环，方便边看日志边发；若要停可手动点停止
            saveMultiItems();
        }
        function onMultiMaskClick(ev) {
            if (ev.target && ev.target.id === 'multi-modal') closeMultiModal();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMultiModal();
                if (document.body.classList.contains('log-theater')) toggleLogTheater();
            }
        });

        function loadMultiItems() {
            try {
                const raw = JSON.parse(localStorage.getItem(MULTI_KEY) || 'null');
                if (Array.isArray(raw) && raw.length) {
                    multiItems = raw.map(it => ({
                        enabled: !!it.enabled,
                        text: it.text || '',
                        hex: !!it.hex,
                    }));
                }
            } catch (e) { /* ignore */ }
            // 默认一页 10 条（序号显示 1–10）
            if (!multiItems.length) {
                multiItems = Array.from({ length: 10 }, () => ({ enabled: false, text: '', hex: false }));
            }
            multiPageIndex = 0;
        }
        function saveMultiItems() {
            try {
                localStorage.setItem(MULTI_KEY, JSON.stringify(multiItems));
            } catch (e) {
                console.warn('save multi items failed', e);
            }
            updateMultiStatus();
        }
        function pageSize() {
            return parseInt(multiPageSizeEl && multiPageSizeEl.value, 10) || 10;
        }
        function pageCount() {
            return Math.max(1, Math.ceil(multiItems.length / pageSize()));
        }
        function updateMultiStatus() {
            const n = multiItems.filter(it => it.enabled && (it.text || '').trim()).length;
            const el = document.getElementById('multi-status');
            if (el) el.textContent = n + ' 条已勾选（有内容）';
            const total = document.getElementById('multi-total');
            if (total) total.textContent = String(multiItems.length);
            const info = document.getElementById('multi-page-info');
            if (info) info.textContent = '页码 ' + (multiPageIndex + 1) + '/' + pageCount();
        }
        function renderMultiList() {
            if (!multiListEl) return;
            if (multiPageIndex >= pageCount()) multiPageIndex = pageCount() - 1;
            if (multiPageIndex < 0) multiPageIndex = 0;
            const ps = pageSize();
            const start = multiPageIndex * ps;
            const slice = multiItems.slice(start, start + ps);
            multiListEl.innerHTML = '';
            slice.forEach((it, i) => {
                const idx = start + i;
                const row = document.createElement('div');
                row.className = 'multi-row';
                row.dataset.idx = String(idx);

                const labEn = document.createElement('label');
                labEn.className = 'chk';
                labEn.title = '勾选后参与发送';
                const cbEn = document.createElement('input');
                cbEn.type = 'checkbox';
                cbEn.dataset.k = 'enabled';
                cbEn.checked = !!it.enabled;
                labEn.appendChild(cbEn);

                const idxEl = document.createElement('span');
                idxEl.className = 'idx';
                idxEl.textContent = String(idx + 1); // 显示从 1 开始

                const textIn = document.createElement('input');
                textIn.type = 'text';
                textIn.dataset.k = 'text';
                textIn.value = it.text || '';
                textIn.placeholder = '条目 ' + (idx + 1) + ' 内容';

                const labHex = document.createElement('label');
                labHex.className = 'mini-chk';
                labHex.title = '本条按 HEX 发送（覆盖公共模式）';
                const cbHex = document.createElement('input');
                cbHex.type = 'checkbox';
                cbHex.dataset.k = 'hex';
                cbHex.checked = !!it.hex;
                labHex.appendChild(cbHex);
                labHex.appendChild(document.createTextNode(' HEX'));

                const btnOne = document.createElement('button');
                btnOne.type = 'button';
                btnOne.className = 'btn ghost';
                btnOne.dataset.k = 'sendone';
                btnOne.style.padding = '4px 8px';
                btnOne.textContent = '发';

                row.appendChild(labEn);
                row.appendChild(idxEl);
                row.appendChild(textIn);
                row.appendChild(labHex);
                row.appendChild(btnOne);
                multiListEl.appendChild(row);
            });
            updateMultiStatus();
        }
        function currentEncoding() {
            return (serialEncodingSelect && serialEncodingSelect.value) || defaultEncoding || 'gbk';
        }

        function parseHexToBytes(hexStr) {
            const cleaned = String(hexStr || '').replace(/0x/gi, ' ').replace(/,/g, ' ').trim();
            const parts = cleaned.split(/\s+/).filter(Boolean);
            let hexOnly;
            if (parts.length && parts.every(p => /^[0-9a-fA-F]+$/.test(p))) {
                hexOnly = parts.map(p => (p.length % 2 === 1 ? '0' + p : p)).join('');
            } else {
                hexOnly = cleaned.replace(/[^0-9a-fA-F]/g, '');
            }
            if (!hexOnly) throw new Error('HEX 内容为空');
            if (hexOnly.length % 2 !== 0) throw new Error('HEX 长度必须为偶数');
            const arr = new Uint8Array(hexOnly.length / 2);
            for (let i = 0; i < hexOnly.length; i += 2) {
                arr[i / 2] = parseInt(hexOnly.substr(i, 2), 16);
            }
            return arr;
        }

        function bytesToHexSpaced(bytes) {
            return Array.from(bytes).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
        }

        /** 浏览器本地转换：解码支持 gbk/utf-8；编码优先 UTF-8（GBK 编码需 Hub） */
        function localConvert(direction, data, enc) {
            const toHex = direction === 'to_hex' || direction === 'hex' || direction === 'encode';
            if (toHex) {
                // 文本 → HEX：浏览器 TextEncoder 仅 UTF-8
                const bytes = new TextEncoder().encode(String(data));
                return {
                    ok: true,
                    result: bytesToHexSpaced(bytes),
                    encoding: 'utf-8',
                    fallback: true,
                    note: (enc && enc !== 'utf-8')
                        ? '本地仅能按 UTF-8 转 HEX；请重启 Hub 以使用 ' + enc
                        : '',
                };
            }
            // HEX → 文本
            const bytes = parseHexToBytes(data);
            const label = (enc || 'utf-8').toLowerCase();
            const candidates = label === 'utf-8' || label === 'utf8'
                ? ['utf-8']
                : [label, 'gbk', 'gb18030', 'utf-8'];
            let lastErr = null;
            for (const c of candidates) {
                try {
                    const text = new TextDecoder(c, { fatal: false }).decode(bytes);
                    return { ok: true, result: text, encoding: c, fallback: true };
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error('无法解码 HEX');
        }

        /** 优先 Hub /api/convert（支持 GBK 编码）；失败则本地兜底，避免 unknown path 直接失败 */
        async function convertViaHub(direction, data) {
            const enc = currentEncoding();
            try {
                const resp = await fetch(apiBase + '/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify({ direction, data, encoding: enc }),
                    cache: 'no-store',
                });
                const json = await resp.json();
                if (json && json.ok && typeof json.result === 'string') {
                    return { ok: true, result: json.result, encoding: json.encoding || enc };
                }
                // Hub 返回 unknown path / 其它业务错误 → 本地兜底
            } catch (e) {
                // 网络错误 → 本地兜底
            }
            try {
                return localConvert(direction, data, enc);
            } catch (e2) {
                return { ok: false, error: (e2 && e2.message) || String(e2) };
            }
        }

        async function onMultiHexToggle(idx, wantHex, checkboxEl) {
            const item = multiItems[idx];
            if (!item) return;
            const prev = item.text || '';
            // 空内容只改标记
            if (!prev.trim()) {
                item.hex = wantHex;
                saveMultiItems();
                return;
            }
            // 已经是目标状态则跳过
            if (!!item.hex === !!wantHex) return;

            if (wantHex) {
                const r = await convertViaHub('to_hex', prev);
                if (!r.ok) {
                    if (checkboxEl) checkboxEl.checked = false;
                    appendLog('SYSTEM', '转 HEX 失败: ' + r.error);
                    return;
                }
                item.text = r.result;
                item.hex = true;
                if (r.fallback) {
                    appendLog('SYSTEM', r.note
                        ? ('已本地转 HEX（' + r.note + '）')
                        : '已本地转 HEX。重启 Hub 后可按连接栏编码精确转换。');
                }
            } else {
                const r = await convertViaHub('to_text', prev);
                if (!r.ok) {
                    if (checkboxEl) checkboxEl.checked = true;
                    appendLog('SYSTEM', 'HEX 转文本失败: ' + r.error + '（已保持 HEX）');
                    return;
                }
                item.text = r.result;
                item.hex = false;
                if (r.fallback) {
                    appendLog('SYSTEM', '已本地 HEX→文本（编码: ' + (r.encoding || 'utf-8') + '）。重启 Hub 后更准确。');
                }
            }
            saveMultiItems();
            renderMultiList();
        }

        if (multiListEl) {
            multiListEl.addEventListener('change', (e) => {
                const t = e.target;
                const row = t.closest('.multi-row');
                if (!row) return;
                const idx = parseInt(row.dataset.idx, 10);
                const k = t.dataset.k;
                if (k === 'enabled') {
                    multiItems[idx].enabled = t.checked;
                    saveMultiItems();
                }
                if (k === 'hex') {
                    // 勾选：文本→HEX；取消：HEX→文本
                    onMultiHexToggle(idx, t.checked, t);
                }
            });
            multiListEl.addEventListener('input', (e) => {
                const t = e.target;
                if (t.dataset.k !== 'text') return;
                const row = t.closest('.multi-row');
                if (!row) return;
                const idx = parseInt(row.dataset.idx, 10);
                multiItems[idx].text = t.value;
                saveMultiItems();
            });
            multiListEl.addEventListener('click', (e) => {
                const t = e.target.closest('[data-k="sendone"]');
                if (!t) return;
                const row = t.closest('.multi-row');
                const idx = parseInt(row.dataset.idx, 10);
                sendOnePayload(multiItems[idx].text, multiItems[idx].hex ? 'hex' : null);
            });
        }
        if (multiPageSizeEl) {
            multiPageSizeEl.addEventListener('change', () => {
                multiPageIndex = 0;
                renderMultiList();
            });
        }

        function multiGoPage(delta) {
            multiPageIndex = Math.min(pageCount() - 1, Math.max(0, multiPageIndex + delta));
            renderMultiList();
        }
        function multiSelectAll(on) {
            const ps = pageSize();
            const start = multiPageIndex * ps;
            const end = Math.min(multiItems.length, start + ps);
            for (let i = start; i < end; i++) multiItems[i].enabled = on;
            saveMultiItems();
            renderMultiList();
        }
        function multiAddRows(n) {
            const count = Math.max(1, parseInt(n, 10) || 10);
            for (let i = 0; i < count; i++) multiItems.push({ enabled: false, text: '', hex: false });
            saveMultiItems();
            multiPageIndex = pageCount() - 1;
            renderMultiList();
        }
        /** 按当前「每页」条数添加一整页（默认每页 10 条） */
        function multiAddOnePage() {
            multiAddRows(pageSize() || 10);
        }
        function multiClearEmpty() {
            multiItems = multiItems.filter(it => (it.text || '').trim() !== '');
            // 不足一页时补齐到 10 条，保证默认至少一页
            while (multiItems.length < 10) {
                multiItems.push({ enabled: false, text: '', hex: false });
            }
            multiPageIndex = 0;
            saveMultiItems();
            renderMultiList();
        }
        async function multiExport() {
            const text = JSON.stringify(multiItems, null, 2);
            const name = 'serial_multi_items.json';
            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: name,
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
                    });
                    const w = await handle.createWritable();
                    await w.write(text);
                    await w.close();
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
                    a.download = name;
                    a.click();
                }
                appendLog('SYSTEM', '多条发送条目已导出。');
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                appendLog('SYSTEM', '导出条目失败: ' + (e.message || e));
            }
        }
        function multiImport() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json,text/plain';
            input.onchange = async () => {
                const file = input.files && input.files[0];
                if (!file) return;
                try {
                    const raw = JSON.parse(await file.text());
                    if (!Array.isArray(raw)) throw new Error('JSON 需为数组');
                    multiItems = raw.map(it => ({
                        enabled: !!it.enabled,
                        text: String(it.text || it.payload || ''),
                        hex: !!it.hex,
                    }));
                    if (!multiItems.length) throw new Error('空列表');
                    multiPageIndex = 0;
                    saveMultiItems();
                    renderMultiList();
                    appendLog('SYSTEM', '已导入 ' + multiItems.length + ' 条发送条目。');
                } catch (e) {
                    appendLog('SYSTEM', '导入失败: ' + (e.message || e));
                }
            };
            input.click();
        }

        function getEnabledMultiItems() {
            return multiItems
                .map((it, idx) => ({ ...it, idx }))
                .filter(it => it.enabled && (it.text || '').trim());
        }

        function highlightMultiRow(idx) {
            if (!multiListEl) return;
            multiListEl.querySelectorAll('.multi-row').forEach(r => {
                r.classList.toggle('sending', parseInt(r.dataset.idx, 10) === idx);
            });
        }

        function sendMultiSelectedOnce() {
            const list = getEnabledMultiItems();
            if (!list.length) {
                appendLog('SYSTEM', '请先勾选并填写要发送的条目。');
                return;
            }
            // 顺序发送，小间隔避免粘包观感
            let i = 0;
            const step = () => {
                if (i >= list.length) {
                    appendLog('SYSTEM', '多条发送完成：' + list.length + ' 条');
                    highlightMultiRow(-1);
                    return;
                }
                const it = list[i++];
                highlightMultiRow(it.idx);
                sendOnePayload(it.text, it.hex ? 'hex' : null);
                setTimeout(step, 30);
            };
            step();
        }

        function toggleMultiCycle() {
            if (multiCycleRunning) stopMultiCycle(false);
            else startMultiCycle();
        }
        function startMultiCycle() {
            if (!serialState.connected) {
                appendLog('SYSTEM', '请先连接串口。');
                return;
            }
            const list = getEnabledMultiItems();
            if (!list.length) {
                appendLog('SYSTEM', '请先勾选并填写要循环发送的条目。');
                return;
            }
            let ms = parseInt(periodMs.value, 10);
            if (!Number.isFinite(ms) || ms < 10) {
                appendLog('SYSTEM', '周期至少 10 ms。');
                return;
            }
            if (cycleRunning) stopCycle(true);
            stopMultiCycle(true);
            multiCycleRunning = true;
            multiCycleIndex = 0;
            if (multiCycleBtn) {
                multiCycleBtn.textContent = '停止循环';
                multiCycleBtn.classList.add('cycle-on');
            }
            const tick = () => {
                const cur = getEnabledMultiItems();
                if (!cur.length) {
                    appendLog('SYSTEM', '循环发送：无可用条目，已停止。');
                    stopMultiCycle(false);
                    return;
                }
                if (multiCycleIndex >= cur.length) multiCycleIndex = 0;
                const it = cur[multiCycleIndex++];
                highlightMultiRow(it.idx);
                sendOnePayload(it.text, it.hex ? 'hex' : null);
            };
            tick();
            multiCycleTimer = setInterval(tick, ms);
            appendLog('SYSTEM', `多条循环发送已启动：每 ${ms} ms，共 ${list.length} 条轮询`);
        }
        function stopMultiCycle(silent) {
            if (multiCycleTimer) { clearInterval(multiCycleTimer); multiCycleTimer = null; }
            const was = multiCycleRunning;
            multiCycleRunning = false;
            if (multiCycleBtn) {
                multiCycleBtn.textContent = '循环发送勾选';
                multiCycleBtn.classList.remove('cycle-on');
            }
            highlightMultiRow(-1);
            if (was && !silent) appendLog('SYSTEM', '多条循环发送已停止。');
        }

        function setWsStatus(ok, text) {
            wsStatusEl.className = 'ws-pill ' + (ok ? 'ok' : 'bad');
            wsStatusText.textContent = text;
        }

        function connectWs() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
            setWsStatus(false, 'WebSocket: 连接中...');
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                reconnectDelay = 1000;
                setWsStatus(true, 'WebSocket: 已连接（长连）');
                appendLog('SYSTEM', '已连接 Serial Hub。');
                startPing();
                refreshPorts();
            };
            ws.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch { return; }
                if (data.type === 'health') {
                    applyHealthInfo(data);
                } else if (data.type === 'status') {
                    serialState = {
                        connected: !!data.connected,
                        port: data.port,
                        baudrate: data.baudrate,
                        encoding: data.encoding || defaultEncoding,
                        reconnecting: !!data.reconnecting
                    };
                    updateSerialUI();
                    if (!serialState.connected && !serialState.reconnecting) {
                        if (cycleRunning) stopCycle(true);
                        if (multiCycleRunning) stopMultiCycle(true);
                    }
                } else if (data.type === 'ports') {
                    applyPortList(data.ports || []);
                } else if (data.type === 'history') {
                    for (const it of (data.items || [])) {
                        appendLogEntry(it.source, it.msg, it.seq, it.ts, true, it.hex);
                    }
                } else if (data.type === 'pong') {
                } else if (data.source) {
                    appendLogEntry(data.source, data.msg, data.seq, data.ts, false, data.hex);
                }
            };
            ws.onclose = () => {
                stopPing();
                if (cycleRunning) stopCycle(true);
                if (multiCycleRunning) stopMultiCycle(true);
                setWsStatus(false, 'WebSocket: 已断开，' + (reconnectDelay / 1000).toFixed(1) + 's 后重连...');
                setTimeout(connectWs, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
            };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        function startPing() {
            stopPing();
            pingTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: 'ping' }));
                }
            }, 15000);
        }
        function stopPing() {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sourceLabel(source) {
            switch (source) {
                case 'LLM': return '[AI Agent 发出]';
                case 'HARDWARE': return '[下位机 返回]';
                case 'USER_OVERRIDE': return '[人类/网页 发送]';
                case 'SYSTEM': return '[系统]';
                default: return '[' + source + ']';
            }
        }

        function formatTime(ts) {
            if (ts) return new Date(ts * 1000).toLocaleTimeString('en-US', { hour12: false });
            return new Date().toLocaleTimeString('en-US', { hour12: false });
        }

        function highlightKeywords(html) {
            return html
                .replace(/\b(error|fail|failed|fatal|err|exception|crash)\b/gi,
                    '<span class="hl-error">$1</span>')
                .replace(/\b(warn|warning|alert|retry|timeout)\b/gi,
                    '<span class="hl-warn">$1</span>')
                .replace(/\b(success|ok|pass|ready|done|connected|open)\b/gi,
                    '<span class="hl-ok">$1</span>')
                .replace(/\b(info|notice|status)\b/gi,
                    '<span class="hl-info">$1</span>');
        }

        function formatRxMessage(msg, hexFromServer) {
            const mode = rxDisplayMode.value;
            const raw = msg || '';
            const textHtml = highlightKeywords(
                escapeHtml(raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n'))
            ).replace(/\n/g, '<br>');
            const hex = hexFromServer || '';
            const hexHtml = hex
                ? `<span class="msg-hex">${highlightKeywords(escapeHtml(hex))}</span>`
                : '';
            if (mode === 'text') return textHtml;
            if (mode === 'hex') return hexHtml || textHtml;
            if (hex) return `${textHtml}<br>${hexHtml}`;
            return textHtml;
        }

        function updateLogCount() {
            logCountLabel.textContent = '日志: ' + displayCount + ' 条';
        }

        function pushStore(entry) {
            logStore.push(entry);
            if (logStore.length > LOG_STORE_MAX) {
                logStore.splice(0, logStore.length - LOG_STORE_MAX);
            }
        }

        function appendLog(source, msg) {
            appendLogEntry(source, msg, null, Date.now() / 1000, false, null);
        }

        function appendLogEntry(source, msg, seq, ts, isHistory, hexMsg, skipStore) {
            const timeStr = formatTime(ts);
            if (!skipStore) {
                if (seq != null) {
                    if (seenSeq.has(seq)) return;
                    seenSeq.add(seq);
                    if (seenSeq.size > 8000) seenSeq = new Set([...seenSeq].slice(-4000));
                }
                pushStore({
                    seq: seq,
                    ts: ts || (Date.now() / 1000),
                    time: timeStr,
                    source: source,
                    label: sourceLabel(source),
                    msg: msg || '',
                    hex: hexMsg || ''
                });
            }

            const div = document.createElement('div');
            div.className = 'log-entry';
            let htmlMsg;
            if (source === 'HARDWARE') {
                htmlMsg = formatRxMessage(msg, hexMsg);
            } else {
                const normalizedMsg = (msg || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                htmlMsg = highlightKeywords(escapeHtml(normalizedMsg)).replace(/\n/g, '<br>');
            }
            const sameAsLast = lastLogSource === source;
            const showTimestamp = showTimestampEl.checked;
            const showSource = showSourceEl.checked;
            const sourcePart = (showSource && !sameAsLast)
                ? `<span class="source-${source}">${sourceLabel(source)}</span> `
                : '';
            const timestampPart = showTimestamp
                ? `<span class="timestamp">[${timeStr}]</span> `
                : '';
            div.innerHTML = timestampPart + sourcePart + `<span class="msg-content">${htmlMsg}</span>`;
            logContainer.appendChild(div);
            if (showSource) lastLogSource = source;
            displayCount++;
            updateLogCount();
            if (autoScrollEl.checked) logContainer.scrollTop = logContainer.scrollHeight;
        }

        function isLogScrolledToBottom() {
            return logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 10;
        }

        function rebuildLogView() {
            const wasAtBottom = isLogScrolledToBottom();
            const oldScrollTop = logContainer.scrollTop;
            logContainer.innerHTML = '';
            displayCount = 0;
            lastLogSource = null;
            for (const it of logStore) {
                appendLogEntry(it.source, it.msg, it.seq, it.ts, true, it.hex, true);
            }
            updateLogCount();
            if (wasAtBottom && autoScrollEl.checked) {
                logContainer.scrollTop = logContainer.scrollHeight;
            } else {
                logContainer.scrollTop = oldScrollTop;
            }
        }

        function clearLog() {
            logContainer.innerHTML = '';
            displayCount = 0;
            lastLogSource = null;
            logStore.length = 0;
            updateLogCount();
        }

        // ---------- 导出 TXT ----------
        function formatExportText(items) {
            const lines = [];
            lines.push('# Serial Hub Log Export');
            lines.push('# time: ' + new Date().toISOString());
            lines.push('# port: ' + (serialState.port || '-'));
            lines.push('# encoding: ' + (serialState.encoding || '-'));
            lines.push('# count: ' + items.length);
            lines.push('#');
            for (const it of items) {
                const t = it.time || formatTime(it.ts);
                const label = it.label || sourceLabel(it.source);
                let body = (it.msg || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                if (it.hex) body += (body ? '\n' : '') + 'HEX: ' + it.hex;
                // 多行消息缩进续行
                const bodyLines = body.split('\n');
                if (bodyLines.length === 1) {
                    lines.push(`[${t}] ${label} ${bodyLines[0]}`);
                } else {
                    lines.push(`[${t}] ${label}`);
                    for (const bl of bodyLines) lines.push('  ' + bl);
                }
            }
            // Windows 友好 CRLF
            return lines.join('\r\n') + '\r\n';
        }

        async function fetchHubLogsForExport() {
            // 优先从 Hub 拉满缓冲，失败则用页面缓存
            try {
                const url = apiBase + '/api/recent?limit=5000';
                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (data && data.ok && Array.isArray(data.items) && data.items.length) {
                    return data.items.map(it => ({
                        ts: it.ts,
                        time: formatTime(it.ts),
                        source: it.source,
                        label: sourceLabel(it.source),
                        msg: it.msg || '',
                        hex: it.hex || ''
                    }));
                }
            } catch (e) {
                // fallback
            }
            return logStore.slice();
        }

        function defaultExportName() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
            const port = (serialState.port || 'serial').replace(/[^\w\-]+/g, '_');
            return `serial_log_${port}_${stamp}.txt`;
        }

        async function saveTextFile(text, filename) {
            // Chromium: 系统「另存为」对话框，可选目录
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{
                            description: 'Text Files',
                            accept: { 'text/plain': ['.txt'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    return { ok: true, method: 'picker' };
                } catch (e) {
                    if (e && e.name === 'AbortError') return { ok: false, aborted: true };
                    // 继续 fallback
                }
            }
            // 兼容：触发浏览器下载（用户可在下载设置里选目录）
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(a.href);
                a.remove();
            }, 1000);
            return { ok: true, method: 'download' };
        }

        async function exportLogs() {
            const btn = document.getElementById('export-btn');
            btn.disabled = true;
            try {
                const items = await fetchHubLogsForExport();
                if (!items.length) {
                    appendLog('SYSTEM', '没有可导出的日志。');
                    return;
                }
                const text = formatExportText(items);
                const name = defaultExportName();
                const result = await saveTextFile(text, name);
                if (result.aborted) {
                    appendLog('SYSTEM', '已取消导出。');
                } else if (result.ok) {
                    appendLog('SYSTEM', `已导出 ${items.length} 条日志 → ${name}` +
                        (result.method === 'picker' ? '（已选择保存位置）' : '（浏览器下载）'));
                } else {
                    appendLog('SYSTEM', '导出失败。');
                }
            } catch (e) {
                appendLog('SYSTEM', '导出失败: ' + (e && e.message ? e.message : e));
            } finally {
                btn.disabled = false;
            }
        }

        function applyPortList(ports) {
            const prev = serialPortSelect.value || serialPortInput.value.trim();
            serialPortSelect.innerHTML = '';
            if (!ports.length) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '未找到串口';
                serialPortSelect.appendChild(opt);
            } else {
                for (const p of ports) {
                    const opt = document.createElement('option');
                    opt.value = p.device;
                    const desc = p.description ? (' — ' + p.description) : '';
                    opt.textContent = p.device + desc;
                    opt.title = (p.device + desc + (p.hwid ? (' | ' + p.hwid) : ''));
                    serialPortSelect.appendChild(opt);
                }
                if (prev && [...serialPortSelect.options].some(o => o.value === prev)) {
                    serialPortSelect.value = prev;
                }
                if (!serialPortInput.value.trim() && serialPortSelect.value) {
                    serialPortInput.value = serialPortSelect.value;
                }
            }
            if (serialState.connected && serialState.port &&
                ![...serialPortSelect.options].some(o => o.value === serialState.port)) {
                const opt = document.createElement('option');
                opt.value = serialState.port;
                opt.textContent = serialState.port + ' — 已连接';
                serialPortSelect.insertBefore(opt, serialPortSelect.firstChild);
                serialPortSelect.value = serialState.port;
            }
        }

        function refreshPorts() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'list_ports' }));
            }
        }
        function resolvePort() {
            return serialPortInput.value.trim() || serialPortSelect.value || '';
        }
        function buildWriteOptions(modeOverride) {
            return {
                mode: modeOverride || txMode.value,
                eol: txEol.value,
                checksum: txChecksum.value,
            };
        }

        /** 底层发送：不清空输入框。modeOverride 可为 'hex'/'text'/null */
        function sendOnePayload(payload, modeOverride, fromCycle) {
            const data = payload == null ? '' : String(payload);
            // 单条周期/多条：允许保留前后空格；手动单次 trim 判断空
            if (!fromCycle && !data.trim()) return false;
            if (fromCycle && !data.trim()) {
                appendLog('SYSTEM', '周期发送：内容为空，已停止。');
                stopCycle(false);
                stopMultiCycle(false);
                return false;
            }
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendLog('SYSTEM', 'WebSocket 未连接，无法发送。');
                if (fromCycle) { stopCycle(true); stopMultiCycle(true); }
                return false;
            }
            if (!serialState.connected) {
                appendLog('SYSTEM', '串口未连接。');
                if (fromCycle) { stopCycle(true); stopMultiCycle(true); }
                return false;
            }
            ws.send(JSON.stringify({
                action: 'write',
                payload: data,
                options: buildWriteOptions(modeOverride),
            }));
            return true;
        }

        function sendCommand(fromCycle) {
            // 单条发送：始终保留输入框内容（不再 clear）
            const payload = cmdInput.value;
            if (!fromCycle && !payload.trim()) return;
            const ok = sendOnePayload(payload, null, fromCycle);
            if (ok && !fromCycle) {
                const hist = payload; // 保留原样进历史
                if (hist.trim()) {
                    commandHistory.push(hist);
                    if (commandHistory.length > 50) commandHistory.shift();
                }
                historyIndex = -1;
                draftInput = '';
                // 故意不清除 cmdInput.value
            }
        }

        function toggleCycle() {
            if (cycleRunning) stopCycle(false);
            else startCycle();
        }
        function startCycle() {
            if (!serialState.connected) {
                appendLog('SYSTEM', '请先连接串口再周期发送。');
                return;
            }
            if (!cmdInput.value.trim()) {
                appendLog('SYSTEM', '请先输入要周期发送的内容。');
                return;
            }
            let ms = parseInt(periodMs.value, 10);
            if (!Number.isFinite(ms) || ms < 10) {
                appendLog('SYSTEM', '周期至少 10 ms。');
                return;
            }
            if (multiCycleRunning) stopMultiCycle(true);
            stopCycle(true);
            cycleRunning = true;
            txCycle.checked = true;
            cycleBtn.textContent = '停止周期';
            cycleBtn.classList.add('cycle-on');
            sendCommand(true);
            cycleTimer = setInterval(() => sendCommand(true), ms);
            appendLog('SYSTEM', `单条周期发送已启动：每 ${ms} ms（内容保留）`);
            savePrefs();
        }
        function stopCycle(silent) {
            if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; }
            const was = cycleRunning;
            cycleRunning = false;
            txCycle.checked = false;
            cycleBtn.textContent = '开始周期';
            cycleBtn.classList.remove('cycle-on');
            if (was && !silent) appendLog('SYSTEM', '单条周期发送已停止。');
        }
        function restartCycle() {
            if (cycleRunning) startCycle();
            if (multiCycleRunning) startMultiCycle();
        }
        txCycle.addEventListener('change', () => {
            if (txCycle.checked) startCycle();
            else stopCycle(false);
        });

        function toggleSerial() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendLog('SYSTEM', 'WebSocket 未连接。');
                return;
            }
            if (serialState.connected) {
                stopCycle(true);
                stopMultiCycle(true);
                ws.send(JSON.stringify({ action: 'close' }));
            } else {
                const port = resolvePort();
                if (!port) {
                    appendLog('SYSTEM', '请先选择或输入串口。');
                    return;
                }
                ws.send(JSON.stringify({
                    action: 'connect',
                    payload: {
                        port,
                        baudrate: parseInt(serialBaudSelect.value, 10),
                        encoding: serialEncodingSelect.value
                    }
                }));
            }
        }

        function updateSerialUI() {
            suppressEncodingEvent = true;
            if (serialState.connected) {
                serialStatusLabel.textContent = `串口: ${serialState.port} (${serialState.encoding || defaultEncoding})`;
                serialStatusLabel.className = 'status-chip on';
                serialToggleBtn.textContent = '断开';
                serialToggleBtn.classList.add('danger');
                serialPortInput.value = serialState.port || '';
                serialPortInput.disabled = true;
                serialPortSelect.disabled = true;
                serialBaudSelect.value = String(serialState.baudrate || 115200);
                serialBaudSelect.disabled = true;
                if (serialState.encoding) serialEncodingSelect.value = serialState.encoding;
                serialEncodingSelect.disabled = false;
                if (serialState.port) {
                    if (![...serialPortSelect.options].some(o => o.value === serialState.port)) {
                        const opt = document.createElement('option');
                        opt.value = serialState.port;
                        opt.textContent = serialState.port + ' — 已连接';
                        serialPortSelect.appendChild(opt);
                    }
                    serialPortSelect.value = serialState.port;
                }
            } else if (serialState.reconnecting) {
                serialStatusLabel.textContent = `串口: 重连中… (${serialState.port || ''})`;
                serialStatusLabel.className = 'status-chip off';
                serialToggleBtn.textContent = '取消重连';
                serialToggleBtn.classList.add('danger');
                serialPortInput.disabled = true;
                serialPortSelect.disabled = true;
                serialBaudSelect.disabled = true;
                serialEncodingSelect.disabled = true;
            } else {
                serialStatusLabel.textContent = '串口: 未连接';
                serialStatusLabel.className = 'status-chip off';
                serialToggleBtn.textContent = '连接';
                serialToggleBtn.classList.remove('danger');
                serialPortInput.disabled = false;
                serialPortSelect.disabled = false;
                serialBaudSelect.disabled = false;
                serialEncodingSelect.disabled = false;
            }
            suppressEncodingEvent = false;
        }

        serialPortSelect.addEventListener('change', () => {
            if (serialPortSelect.value) serialPortInput.value = serialPortSelect.value;
        });
        serialEncodingSelect.addEventListener('change', () => {
            if (suppressEncodingEvent) return;
            if (ws && ws.readyState === WebSocket.OPEN && serialState.connected) {
                ws.send(JSON.stringify({
                    action: 'set_encoding',
                    payload: { encoding: serialEncodingSelect.value }
                }));
            }
        });

        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendCommand(false);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!commandHistory.length) return;
                if (historyIndex === -1) draftInput = cmdInput.value;
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[commandHistory.length - 1 - historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex === -1) return;
                historyIndex--;
                cmdInput.value = historyIndex === -1 ? draftInput
                    : commandHistory[commandHistory.length - 1 - historyIndex];
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') connectWs();
        });

        loadMultiItems();
        renderMultiList();
        checkHubHealthHttp();
        connectWs();
        // 定期复查版本（防止旧 Hub 未重启）
        setInterval(checkHubHealthHttp, 30000);
    </script>
</body>
</html>
